# Ships niduslabs.dev: once Checks pass on main, deploys the Worker and its
# static assets, then checks that the live Splito privacy policy has the
# latest wording. This workflow is the only way production changes. Also
# runnable by hand, which deploys main as it is.
name: Deploy

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: >-
      ${{ fromJSON(startsWith(vars.LINUX_RUNNER, '[') && vars.LINUX_RUNNER
      || format('"{0}"', vars.LINUX_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 10
    environment:
      name: production
      url: https://niduslabs.dev
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message || 'Deployed by hand' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret isn't set on this repository."
            exit 1
          fi
          pnpm exec wrangler deploy \
            --tag "${SHA:0:12}" \
            --message "${MESSAGE:0:100}"

      # The policy's newest sentence proves the new version is the one answering.
      - name: Check the live privacy policy
        run: |
          url=https://niduslabs.dev/splito/privacy
          expected='every lookup in our support tools is logged'
          for _ in $(seq 1 12); do
            # DNS over HTTPS through Cloudflare, as in the dashboard's deploy:
            # a runner's resolver may hold a stale answer for the domain.
            page=$(curl --silent --fail --max-time 10 \
              --doh-url https://cloudflare-dns.com/dns-query \
              "$url?v=${SHA:0:12}" || true)
            if grep -qF "$expected" <<<"$page"; then
              echo "OK: $url has \"$expected\"."
              exit 0
            fi
            echo "Waiting: $url doesn't have \"$expected\" yet."
            sleep 10
          done
          echo "::error::$url doesn't show the latest policy wording."
          exit 1
