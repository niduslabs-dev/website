# Checks the site on each push to main and on pull requests: installs, then
# runs wrangler's dry-run deploy, which reads wrangler.jsonc and every file in
# public/ without uploading. Commits that only touch docs skip it. Deploy runs
# after it passes.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build
    # `vars.LINUX_RUNNER` (a label or a JSON array) when set, else GitHub's Ubuntu.
    runs-on: >-
      ${{ fromJSON(startsWith(vars.LINUX_RUNNER, '[') && vars.LINUX_RUNNER
      || format('"{0}"', vars.LINUX_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm check
