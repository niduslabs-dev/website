# Checks the site on each push to main and on pull requests: installs, then
# runs wrangler's dry-run deploy, which reads wrangler.jsonc and every file in
# public/ without uploading. Commits that only touch docs (Markdown, docs/)
# skip it. On main, the same job then ships niduslabs.dev: deploys the Worker
# and its static assets, and checks that the live Splito privacy policy has
# the latest wording. This is the only way production changes. Run by hand on
# main, it checks and deploys main as it is.
name: Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # Never `pull_request_target`: the repo is public, so pull requests from
  # forks must not run with its secrets.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# On main, never cancelled: a run may be deploying. A newer push waits, and
# replaces any push already waiting.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  checks:
    name: Build and deploy
    # GitHub's own runners: free for a public repo. Never the self-hosted Mac
    # or the org's `vars.LINUX_RUNNER`: pull requests from forks run here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only runs that deploy are production deployments.
    environment:
      name: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || '' }}
      url: https://niduslabs.dev
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm check

      - name: Deploy the Worker
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MESSAGE: ${{ github.event.head_commit.message || 'Deployed by hand' }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret isn't set on this repository."
            exit 1
          fi
          pnpm exec wrangler deploy \
            --tag "${SHA:0:12}" \
            --message "${MESSAGE:0:100}"

      # The policy's newest sentence proves the new version is the one answering.
      - name: Check the live privacy policy
        if: env.DEPLOY == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          url=https://niduslabs.dev/splito/privacy
          expected='every lookup in our support tools is logged'
          for _ in $(seq 1 12); do
            # DNS over HTTPS through Cloudflare, as in the dashboard's deploy:
            # a runner's resolver may hold a stale answer for the domain.
            status=$(curl --silent --output "$RUNNER_TEMP/page.html" --max-time 10 \
              --doh-url https://cloudflare-dns.com/dns-query \
              --write-out '%{http_code}' "$url?v=${SHA:0:12}" || true)
            if [ "$status" = 200 ] && grep -qF "$expected" "$RUNNER_TEMP/page.html"; then
              echo "OK: $url has \"$expected\"."
              exit 0
            fi
            echo "Waiting: $url answered $status without \"$expected\"."
            sleep 10
          done
          echo "::error::$url doesn't show the latest policy wording."
          exit 1
